<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Curriculum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        .duration-btn.active {
            background-color: #3b82f6;
            color: white;
        }
        .step-accordion-toggle svg {
            transition: transform 0.3s ease;
        }
        .step-accordion-toggle.open svg {
            transform: rotate(180deg);
        }
        @keyframes glowing {
            0% { box-shadow: 0 0 5px #ec4899, 0 0 10px #ec4899, 0 0 15px #ec4899; }
            50% { box-shadow: 0 0 10px #8b5cf6, 0 0 20px #8b5cf6, 0 0 30px #8b5cf6; }
            100% { box-shadow: 0 0 5px #3b82f6, 0 0 10px #3b82f6, 0 0 15px #3b82f6; }
        }
        .glowing-badge {
            animation: glowing 3s ease-in-out infinite;
        }
    </style>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100">

    <!--NavBar-->
    <header class="fixed top-0 left-0 w-full bg-white dark:bg-gray-800 shadow-md z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="text-xl font-bold text-blue-600 dark:text-blue-400">SmartLearnAI</div>
            <div class="flex items-center space-x-4">
                <button class="focus:outline-none relative"><i data-feather="bell"></i><span class="absolute top-0 right-0 inline-block w-2 h-2 bg-red-600 rounded-full"></span></button>
                <div class="relative">
                    <button id="profileDropdownBtn" class="focus:outline-none rounded-full w-10 h-10 bg-gray-300 dark:bg-gray-700 flex items-center justify-center"><i data-feather="user"></i></button>
                    <div id="profileDropdown" class="hidden absolute right-0 mt-2 w-40 bg-white dark:bg-gray-800 rounded-md shadow-lg z-50">
                        <a href="#" class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700">My Profile</a>
                        <a href="#" class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700">Billing</a>
                        <a href="/logout" class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700">Logout</a>
                    </div>
                </div>
                <button id="toggleMode" onclick="document.documentElement.classList.toggle('dark')" class="ml-2 focus:outline-none"><i data-feather="moon"></i></button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="pt-24 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col lg:flex-row gap-8">

            <!-- Left Section (60%) -->
            <div class="w-full lg:w-[60%]">
                <a href="{{ url_for('dashboard_page') }}" class="inline-flex items-center gap-2 text-blue-600 dark:text-blue-400 hover:underline mb-4">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Back to Dashboard
                </a>
                
                <div id="mainContents" class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6">
                    <h1 id="curriculumTitle" class="text-3xl font-extrabold mb-4 text-gray-900 dark:text-white">Loading Curriculum...</h1>
                    
                    <div id="durationSelector" class="mb-6">
                        <h2 class="text-lg font-semibold mb-2">Duration of Curriculum</h2>
                        <div class="flex gap-2">
                            <button class="duration-btn px-4 py-2 border dark:border-gray-300 dark:bg-gray-700 dark:border-gray-600 rounded-full text-sm font-medium" data-duration="Short Duration path">Short</button>
                            <button class="duration-btn px-4 py-2 border dark:border-gray-300 dark:bg-gray-700 dark:border-gray-600 rounded-full text-sm font-medium" data-duration="Moderate Duration path">Moderate</button>
                            <button class="duration-btn px-4 py-2 border dark:border-gray-300 dark:bg-gray-700 dark:border-gray-600 rounded-full text-sm font-medium" data-duration="Long Duration path">Long</button>
                        </div>
                    </div>
                    
                    <div id="curriculumRoadmap" class="space-y-4">
                        <!-- Dynamic curriculum steps will be injected here -->
                    </div>
                </div>
            </div>

            <!-- Right Section (40%) -->
            <div class="w-full lg:w-[40%] space-y-6">
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6">
                    <h2 class="text-xl font-bold mb-4">Learning Hours</h2>
                    <p class="text-sm text-gray-500 dark:text-gray-400 mb-2">Logged 12 hours this week</p>
                    <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-4">
                        <div class="bg-green-500 h-4 rounded-full" style="width: 60%"></div>
                    </div>
                </div>
                
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6">
                    <h2 class="text-xl font-bold mb-4">XPs Earned</h2>
                    <div class="space-y-4">
                        <div>
                            <div class="flex justify-between text-sm mb-1"><span class="font-medium">Daily Streak</span><span>150 / 200 XP</span></div>
                            <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5"><div class="bg-blue-500 h-2.5 rounded-full" style="width: 75%"></div></div>
                        </div>
                        <div>
                            <div class="flex justify-between text-sm mb-1"><span class="font-medium">Step 1 Completion</span><span>100 / 100 XP</span></div>
                            <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5"><div class="bg-blue-500 h-2.5 rounded-full" style="width: 100%"></div></div>
                        </div>
                        <div>
                            <div class="flex justify-between text-sm mb-1"><span class="font-medium">Missed Bonus</span><span class="text-red-500">0 / 50 XP</span></div>
                            <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5"><div class="bg-red-500 h-2.5 rounded-full" style="width: 0%"></div></div>
                        </div>
                    </div>
                </div>

                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6">
                    <h2 class="text-xl font-bold mb-4">Badges Earned</h2>
                    <div class="flex items-center gap-6">
                        <div class="text-center">
                            <div class="w-24 h-24 bg-gray-200 dark:bg-gray-700 rounded-full flex items-center justify-center glowing-badge">
                                <svg class="w-16 h-16 text-transparent" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
                            </div>
                            <p class="text-sm mt-2 font-medium">Next: Code Starter</p>
                        </div>
                        <div class="flex-1 grid grid-cols-3 gap-4">
                            <div class="w-12 h-12 bg-gray-200 dark:bg-gray-700 rounded-full"></div>
                            <div class="w-12 h-12 bg-gray-200 dark:bg-gray-700 rounded-full"></div>
                            <div class="w-12 h-12 bg-gray-200 dark:bg-gray-700 rounded-full"></div>
                            <div class="w-12 h-12 bg-gray-200 dark:bg-gray-700 rounded-full"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- Navbar and Theme Logic ---
        document.addEventListener('DOMContentLoaded', () => {
            feather.replace();
            document.getElementById('profileDropdownBtn').addEventListener('click', () => {
                document.getElementById('profileDropdown').classList.toggle('hidden');
            });
            // This ensures the page theme matches the rest of the site
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });

        // --- Curriculum Page Logic ---
        document.addEventListener('DOMContentLoaded', () => {
            const curriculumTitle = document.getElementById('curriculumTitle');
            const durationSelector = document.getElementById('durationSelector');
            const curriculumRoadmap = document.getElementById('curriculumRoadmap');

            // This is where the curriculum data passed from Flask will be available
            // For demonstration, I'll use a mock object. In the real app, this will be populated by Jinja.
            const curriculumData = {{ curriculum_data | tojson }};

            const renderCurriculum = (pathKey) => {
                curriculumRoadmap.innerHTML = ''; // Clear previous content
                const path = curriculumData[pathKey];

                if (!path) {
                    curriculumRoadmap.innerHTML = `<p class="text-gray-500">No curriculum available for this duration.</p>`;
                    return;
                }

                path.forEach((step, index) => {
                    const stepElement = document.createElement('div');
                    stepElement.className = 'border dark:border-gray-700 rounded-lg overflow-hidden';
                    stepElement.innerHTML = `
                        <button class="step-accordion-toggle w-full flex justify-between items-center p-4 bg-gray-50 dark:bg-gray-700/50 hover:bg-gray-100 dark:hover:bg-gray-700">
                            <span class="font-semibold text-lg">Step ${index + 1}: ${step.Step}</span>
                            <svg class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        <div class="step-content hidden p-4 space-y-3">
                            <p><strong>Duration:</strong> ${step.Duration}</p>
                            <p><strong>Description:</strong> ${step.Description}</p>
                            <a href="${step['Course Link']}" target="_blank" class="inline-block text-blue-500 hover:underline">Go to Course &rarr;</a>
                        </div>
                    `;
                    curriculumRoadmap.appendChild(stepElement);
                });
            };

            // Event listener for duration buttons
            durationSelector.addEventListener('click', (e) => {
                if (e.target.matches('.duration-btn')) {
                    document.querySelectorAll('.duration-btn').forEach(btn => btn.classList.remove('active'));
                    e.target.classList.add('active');
                    renderCurriculum(e.target.dataset.duration);
                }
            });

            // Event listener for accordion toggles
            curriculumRoadmap.addEventListener('click', (e) => {
                const toggle = e.target.closest('.step-accordion-toggle');
                if (toggle) {
                    toggle.classList.toggle('open');
                    const content = toggle.nextElementSibling;
                    content.classList.toggle('hidden');
                }
            });

            // Initial render
            if (curriculumData && curriculumData.Title) {
                curriculumTitle.textContent = curriculumData.Title;
                // Default to showing the "Short Duration path"
                document.querySelector('.duration-btn[data-duration="Short Duration path"]').click();
            } else {
                 curriculumTitle.textContent = "Could not load curriculum.";
            }
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Section with Side Strip</title>
    <style>
        .section-with-strip {
            background-color: #f0f0f0; /* Main section background color */
            padding: 20px;
            margin: 20px;
            position: relative; /* Important for positioning the pseudo-element */
            overflow: hidden; /* Ensures pseudo-element doesn't overflow */
        }

        .section-with-strip::before {
            content: ''; /* Required for pseudo-elements */
            position: absolute;
            top: 0;
            left: 0; /* Adjust to 'right: 0;' for a right-side strip */
            width: 10px; /* Width of the side strip */
            height: 100%;
            background-color: #4CAF50; /* Color of the side strip */
        }
    </style>
</head>
<body>

    <div class="section-with-strip">
        <h2>Section Title</h2>
        <p>This is the content of the section. It has a light grey background color.</p>
        <p>A green strip is added to the left side using a CSS pseudo-element.</p>
    </div>

</body>
</html>
